<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>En4tainment - Stage for Stars</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <meta name="description" content="Book live music and entertainment across Sri Lanka. Browse verified performers, request a quote, and confirm your booking in one place." />

    <!-- Share previews. Site-wide only: these cannot be per-artist while the app
         uses HashRouter, because the artist id lives after the # and a URL
         fragment is never sent to the server, so a preview fetcher never learns
         which artist was shared. Per-artist tags are blocked on the
         HashRouter/BrowserRouter decision. og:image is deliberately absent -
         the only candidate asset is a 731x256 transparent logo, and a wrongly
         sized transparent image renders worse than none. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="En4tainment" />
    <meta property="og:title" content="En4tainment - Stage for Stars" />
    <meta property="og:description" content="Book live music and entertainment across Sri Lanka. Browse verified performers, request a quote, and confirm your booking in one place." />
    <meta property="og:url" content="https://www.en4tainment.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="En4tainment - Stage for Stars" />
    <meta name="twitter:description" content="Book live music and entertainment across Sri Lanka. Browse verified performers, request a quote, and confirm your booking in one place." />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
