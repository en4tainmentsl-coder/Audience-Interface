name: Trigger Function ACL

on:
  # Deliberately NOT path-filtered. This check is required in branch
  # protection, and a required check that is path-filtered never reports a
  # status on PRs that do not match -- GitHub then waits on it forever and the
  # PR cannot merge. Caught on PR #191, a docs-only change, 2026-11-01.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trigger-acl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.122.0

      - name: Start local Postgres and apply migrations
        run: supabase db start

      - name: Fail on any exposed trigger function
        run: |
          supabase db query --output json "
            SELECT p.proname
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.prorettype = 'trigger'::regtype
              AND (
                p.proacl IS NULL
                OR EXISTS (
                  SELECT 1 FROM unnest(p.proacl::text[]) a
                  WHERE a LIKE '=%' OR split_part(a,'=',1) IN ('anon','authenticated')
                )
              )
            ORDER BY p.proname;
          " > /tmp/exposed.json
          cat /tmp/exposed.json
          if [ "$(jq 'length' /tmp/exposed.json)" -ne 0 ]; then
            echo "::error::Trigger functions in public are executable by PUBLIC, anon or authenticated. Add an explicit REVOKE naming anon and authenticated."
            exit 1
          fi
          echo "No exposed trigger functions."
