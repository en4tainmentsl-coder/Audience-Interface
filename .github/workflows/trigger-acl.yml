name: Trigger Function ACL

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/trigger-acl.yml'

permissions:
  contents: read

jobs:
  trigger-acl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Postgres and apply migrations
        run: supabase db start

      - name: Fail on any exposed trigger function
        run: |
          supabase db query --output json "
            SELECT p.proname
            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
            WHERE n.nspname = 'public'
              AND p.prorettype = 'trigger'::regtype
              AND (
                p.proacl IS NULL
                OR EXISTS (
                  SELECT 1 FROM unnest(p.proacl::text[]) a
                  WHERE a LIKE '=%' OR split_part(a,'=',1) IN ('anon','authenticated')
                )
              )
            ORDER BY p.proname;
          " > /tmp/exposed.json
          cat /tmp/exposed.json
          if [ "$(jq 'length' /tmp/exposed.json)" -ne 0 ]; then
            echo "::error::Trigger functions in public are executable by PUBLIC, anon or authenticated. Add an explicit REVOKE naming anon and authenticated."
            exit 1
          fi
          echo "No exposed trigger functions."
